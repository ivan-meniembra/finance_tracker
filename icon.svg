<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#1b2340"/>
      <stop offset="55%" stop-color="#111730"/>
      <stop offset="100%" stop-color="#080b17"/>
    </radialGradient>
    <linearGradient id="cardIndigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="cardAmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a5a34"/>
      <stop offset="100%" stop-color="#4a2c17"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="192" height="192" rx="44" fill="url(#bg)"/>

  <g filter="url(#soft)">
    <!-- back card: indigo, tilted left -->
    <g transform="rotate(-15 96 100)">
      <rect x="45" y="64" width="102" height="66" rx="14" fill="url(#cardIndigo)"/>
    </g>

    <!-- middle card: warm amber, tilted right -->
    <g transform="rotate(12 96 100)">
      <rect x="45" y="69" width="102" height="66" rx="14" fill="url(#cardAmber)"/>
    </g>

    <!-- front: leather wallet -->
    <rect x="40" y="80" width="112" height="70" rx="15" fill="url(#leather)"/>
    <rect x="40" y="80" width="112" height="70" rx="15" fill="none" stroke="#2e1a0d" stroke-opacity="0.5" stroke-width="1.5"/>
    <!-- stitch seam -->
    <rect x="48" y="88" width="96" height="54" rx="9" fill="none" stroke="#d4a373" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="3 4"/>

    <!-- gold chip -->
    <rect x="57" y="98" width="24" height="18" rx="4" fill="url(#gold)"/>
    <line x1="57" y1="107" x2="81" y2="107" stroke="#78350f" stroke-opacity="0.55" stroke-width="1.3"/>
  </g>
</svg>
